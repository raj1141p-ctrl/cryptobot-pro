<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CryptoBot Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⚡</span><span>Crypto<span class="accent">Bot</span></span><small>PRO</small></div>
      <div class="mode-pill"><span></span> PAPER TRADING</div>

      <nav>
        <button class="nav active" data-page="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav" data-page="markets">◈ <span>Markets</span></button>
        <button class="nav" data-page="trade">↕ <span>Trade</span></button>
        <button class="nav" data-page="analytics">⌁ <span>Analytics</span></button>
        <button class="nav" data-page="algo">⚙ <span>Algo Trading <b class="nav-new">NEW</b></span></button>
        <button class="nav" data-page="journal">☷ <span>Trade Journal</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="connection"><i></i><span>Market data connected</span></div>
        <div class="connection"><i></i><span>Live orders disabled</span></div>
        <div class="side-note">Public market data only<br>Paper trades stay in this browser.</div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="mobile-brand">⚡ CryptoBot Pro</div>
        <div class="market-title">
          <strong id="headerSymbol">BTC/USDT</strong>
          <span id="headerPrice">$--</span>
          <span id="headerChange" class="green">--</span>
        </div>
        <div class="top-actions">
          <span class="update">Updated <b id="lastUpdate">--:--:--</b></span>
          <button id="refreshBtn" class="icon-btn" title="Refresh">↻</button>
          <button class="avatar">R</button>
        </div>
      </header>

      <section class="content">
        <div id="dashboard" class="page active"></div>
        <div id="markets" class="page"></div>
        <div id="trade" class="page"></div>
        <div id="analytics" class="page"></div>
        <div id="algo" class="page"></div>
        <div id="journal" class="page"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
